<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="100%" style="stop-color:#0a0520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="none" stroke="#7b2ff7" stroke-width="1" rx="8"/>
  <!-- Top accent line -->
  <rect x="0" y="0" width="800" height="3" rx="2" fill="url(#accent)"/>
  <!-- Decorative grid lines -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="#7b2ff7" stroke-width="0.3" opacity="0.2"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#7b2ff7" stroke-width="0.3" opacity="0.2"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#7b2ff7" stroke-width="0.3" opacity="0.2"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#7b2ff7" stroke-width="0.3" opacity="0.2"/>
  <line x1="160" y1="0" x2="160" y2="200" stroke="#7b2ff7" stroke-width="0.3" opacity="0.2"/>
  <line x1="320" y1="0" x2="320" y2="200" stroke="#7b2ff7" stroke-width="0.3" opacity="0.2"/>
  <line x1="480" y1="0" x2="480" y2="200" stroke="#7b2ff7" stroke-width="0.3" opacity="0.2"/>
  <line x1="640" y1="0" x2="640" y2="200" stroke="#7b2ff7" stroke-width="0.3" opacity="0.2"/>
  <!-- floating pixel art decorations -->
  <rect x="20" y="20" width="4" height="4" fill="#7b2ff7" opacity="0.6"/>
  <rect x="28" y="28" width="4" height="4" fill="#38bdf8" opacity="0.4"/>
  <rect x="750" y="20" width="4" height="4" fill="#a855f7" opacity="0.6"/>
  <rect x="758" y="28" width="4" height="4" fill="#38bdf8" opacity="0.4"/>
  <rect x="20" y="168" width="4" height="4" fill="#06b6d4" opacity="0.5"/>
  <rect x="750" y="168" width="4" height="4" fill="#7b2ff7" opacity="0.5"/>
  <!-- Main text -->
  <text x="400" y="75" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="url(#text-grad)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">PEDRO HENRIQUE</text>
  <rect x="200" y="88" width="400" height="2" fill="url(#accent)" rx="1"/>
  <text x="400" y="118" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="6">DESENVOLVEDOR DE SOFTWARE</text>
  <text x="400" y="145" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="4">BACK-END  |  FULL STACK  |  DADOS</text>
  <!-- Bottom accent line -->
  <rect x="0" y="197" width="800" height="3" rx="2" fill="url(#accent)"/>
</svg>
