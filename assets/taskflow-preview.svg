<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050f"/>
      <stop offset="100%" style="stop-color:#0d0520"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="title-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="10" fill="url(#bg)"/>
  <rect width="800" height="320" rx="10" fill="none" stroke="#7b2ff7" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="318" rx="9" fill="none" stroke="#a855f7" stroke-width="0.4" opacity="0.4"/>
  
  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="320" rx="2" fill="url(#accent)"/>
  
  <!-- Header area -->
  <rect x="4" y="0" width="796" height="70" rx="8" fill="url(#header-grad)"/>
  <rect x="4" y="65" width="796" height="1" fill="url(#accent)" opacity="0.5"/>
  
  <!-- Corner decorations -->
  <rect x="12" y="8" width="16" height="2" fill="#a855f7" rx="1"/>
  <rect x="12" y="8" width="2" height="16" fill="#a855f7" rx="1"/>
  <rect x="772" y="8" width="16" height="2" fill="#38bdf8" rx="1"/>
  <rect x="784" y="8" width="2" height="16" fill="#38bdf8" rx="1"/>
  
  <!-- Project badge -->
  <rect x="12" y="12" width="80" height="16" rx="8" fill="#7b2ff7" opacity="0.3" stroke="#a855f7" stroke-width="0.6"/>
  <text x="52" y="23" font-family="monospace" font-size="7" fill="#c084fc" text-anchor="middle" letter-spacing="1">📋 PROJECT</text>
  
  <!-- Title -->
  <text x="20" y="50" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="url(#title-g)" filter="url(#glow)" letter-spacing="2">TaskFlow</text>
  <text x="175" y="50" font-family="monospace" font-size="12" fill="#64748b" letter-spacing="1">— Sistema de Gerenciamento de Tarefas</text>
  
  <!-- Tech badges row -->
  <!-- Back-end label -->
  <text x="20" y="90" font-family="monospace" font-size="7" fill="#38bdf8" letter-spacing="2">▸ BACK-END</text>
  
  <rect x="20" y="96" width="58" height="18" rx="3" fill="#1a1a3e" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="49" y="108" font-family="monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">Node.js</text>
  
  <rect x="84" y="96" width="52" height="18" rx="3" fill="#1a1a3e" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="110" y="108" font-family="monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">Express</text>
  
  <rect x="142" y="96" width="46" height="18" rx="3" fill="#1a1a3e" stroke="#7b2ff7" stroke-width="0.6"/>
  <text x="165" y="108" font-family="monospace" font-size="7.5" fill="#c084fc" text-anchor="middle">JWT</text>
  
  <rect x="194" y="96" width="36" height="18" rx="3" fill="#1a1a3e" stroke="#7b2ff7" stroke-width="0.6"/>
  <text x="212" y="108" font-family="monospace" font-size="7.5" fill="#c084fc" text-anchor="middle">Zod</text>
  
  <rect x="236" y="96" width="52" height="18" rx="3" fill="#1a1a3e" stroke="#06b6d4" stroke-width="0.6"/>
  <text x="262" y="108" font-family="monospace" font-size="7.5" fill="#67e8f9" text-anchor="middle">API REST</text>

  <!-- Front-end label -->
  <text x="20" y="132" font-family="monospace" font-size="7" fill="#a855f7" letter-spacing="2">▸ FRONT-END</text>
  
  <rect x="20" y="138" width="44" height="18" rx="3" fill="#1a1a3e" stroke="#a855f7" stroke-width="0.6"/>
  <text x="42" y="150" font-family="monospace" font-size="7.5" fill="#c084fc" text-anchor="middle">React</text>
  
  <rect x="70" y="138" width="52" height="18" rx="3" fill="#1a1a3e" stroke="#a855f7" stroke-width="0.6"/>
  <text x="96" y="150" font-family="monospace" font-size="7.5" fill="#c084fc" text-anchor="middle">Vite</text>
  
  <rect x="128" y="138" width="62" height="18" rx="3" fill="#1a1a3e" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="159" y="150" font-family="monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">JavaScript</text>
  
  <rect x="196" y="138" width="62" height="18" rx="3" fill="#1a1a3e" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="227" y="150" font-family="monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">React Router</text>

  <!-- Database label -->
  <text x="20" y="174" font-family="monospace" font-size="7" fill="#06b6d4" letter-spacing="2">▸ DATABASE</text>
  
  <rect x="20" y="180" width="62" height="18" rx="3" fill="#1a1a3e" stroke="#06b6d4" stroke-width="0.6"/>
  <text x="51" y="192" font-family="monospace" font-size="7.5" fill="#67e8f9" text-anchor="middle">PostgreSQL</text>
  
  <rect x="88" y="180" width="36" height="18" rx="3" fill="#1a1a3e" stroke="#06b6d4" stroke-width="0.6"/>
  <text x="106" y="192" font-family="monospace" font-size="7.5" fill="#67e8f9" text-anchor="middle">SQL</text>

  <!-- Vertical divider -->
  <rect x="410" y="75" width="1" height="225" fill="#7b2ff7" opacity="0.3"/>

  <!-- Right side: features -->
  <text x="430" y="90" font-family="monospace" font-size="8" fill="#38bdf8" letter-spacing="2">▸ FUNCIONALIDADES</text>
  <rect x="430" y="94" width="340" height="1" fill="#38bdf8" opacity="0.3"/>
  
  <text x="430" y="114" font-family="monospace" font-size="8.5" fill="#e2e8f0">◈  Autenticação de usuários com JWT</text>
  <text x="430" y="132" font-family="monospace" font-size="8.5" fill="#e2e8f0">◈  CRUD completo de tarefas</text>
  <text x="430" y="150" font-family="monospace" font-size="8.5" fill="#e2e8f0">◈  Dashboard de produtividade</text>
  <text x="430" y="168" font-family="monospace" font-size="8.5" fill="#e2e8f0">◈  Controle de prazos e prioridades</text>
  <text x="430" y="186" font-family="monospace" font-size="8.5" fill="#e2e8f0">◈  Categorias de tarefas</text>
  <text x="430" y="204" font-family="monospace" font-size="8.5" fill="#e2e8f0">◈  API RESTful documentada</text>

  <!-- Description left -->
  <rect x="20" y="210" width="378" height="1" fill="#7b2ff7" opacity="0.3"/>
  <text x="20" y="230" font-family="monospace" font-size="8" fill="#94a3b8">Aplicação web Full Stack para organização e</text>
  <text x="20" y="246" font-family="monospace" font-size="8" fill="#94a3b8">gerenciamento de tarefas com autenticação de</text>
  <text x="20" y="262" font-family="monospace" font-size="8" fill="#94a3b8">usuários e dashboard interativo de produtividade.</text>

  <!-- Bottom bar -->
  <rect x="4" y="285" width="796" height="1" fill="url(#accent)" opacity="0.4"/>
  <rect x="4" y="286" width="796" height="34" rx="8" fill="#0a0a1a"/>
  
  <!-- Bottom link button -->
  <rect x="20" y="294" width="180" height="20" rx="10" fill="#7b2ff7" opacity="0.2" stroke="#a855f7" stroke-width="0.8"/>
  <text x="110" y="308" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="middle">🔗 Ver Repositório no GitHub</text>
  
  <!-- Status badge -->
  <rect x="620" y="294" width="60" height="20" rx="10" fill="#064e3b" opacity="0.5" stroke="#10b981" stroke-width="0.8"/>
  <text x="650" y="308" font-family="monospace" font-size="7" fill="#10b981" text-anchor="middle">● ACTIVE</text>
  
  <text x="400" y="308" font-family="monospace" font-size="7" fill="#475569" text-anchor="middle">github.com/pedro-henrique-silva-dev/taskflow</text>
</svg>
